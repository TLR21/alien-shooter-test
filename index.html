<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alien Shooter - OpenCode Integration Test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    #game-container {
      position: relative;
      border: 2px solid #333;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(0, 255, 136, 0.2);
      background: #000;
    }
    canvas {
      display: block;
    }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }
    #hud {
      pointer-events: none;
    }
    #hud {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .hud-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .hud-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888;
    }
    .hud-value {
      font-size: 24px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #00ff88;
      text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
    }
    .health-bar-container {
      width: 200px;
      height: 12px;
      background: #1a1a2e;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #333;
    }
    .health-bar {
      height: 100%;
      background: linear-gradient(90deg, #ff3366, #ff6b35);
      border-radius: 6px;
      transition: width 0.3s ease;
      box-shadow: 0 0 10px rgba(255, 51, 102, 0.5);
    }
    #screen-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(10, 10, 15, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      z-index: 10;
      opacity: 1;
      transition: opacity 0.5s ease;
    }
    #screen-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .screen-title {
      font-size: 48px;
      font-weight: 800;
      background: linear-gradient(135deg, #00ff88, #00ccff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
    }
    .screen-subtitle {
      font-size: 16px;
      color: #888;
      text-align: center;
      max-width: 400px;
    }
    .btn {
      padding: 16px 48px;
      font-size: 18px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #00ff88, #00ccff);
      color: #0a0a0f;
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
    }
    .btn-primary:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(0, 255, 136, 0.6);
    }
    .btn-secondary {
      background: transparent;
      color: #00ff88;
      border: 2px solid #00ff88;
    }
    .btn-secondary:hover {
      background: rgba(0, 255, 136, 0.1);
    }
    .controls-info {
      display: flex;
      gap: 32px;
      margin-top: 16px;
      font-size: 14px;
      color: #666;
    }
    .control-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .key {
      background: #1a1a2e;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 4px 12px;
      font-family: monospace;
      font-size: 13px;
      color: #00ff88;
    }
    #fps-counter {
      position: fixed;
      bottom: 16px;
      right: 16px;
      font-size: 12px;
      font-family: monospace;
      color: #00ff88;
      background: rgba(10, 10, 15, 0.8);
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid #333;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas" width="800" height="600"></canvas>
    <div id="ui-overlay">
      <div id="hud">
        <div class="hud-item">
          <span class="hud-label">Score</span>
          <span class="hud-value" id="score-display">0</span>
        </div>
        <div class="hud-item" style="align-items: center;">
          <span class="hud-label">Health</span>
          <div class="health-bar-container">
            <div class="health-bar" id="health-bar" style="width: 100%"></div>
          </div>
        </div>
        <div class="hud-item" style="align-items: flex-end;">
          <span class="hud-label">Wave</span>
          <span class="hud-value" id="wave-display">1</span>
        </div>
      </div>
      <div id="screen-overlay">
        <h1 class="screen-title">ALIEN SHOOTER</h1>
        <p class="screen-subtitle">Ultimate OpenCode Integration Test — Defend the galaxy from the alien invasion!</p>
        <div class="controls-info">
          <div class="control-item"><span class="key">W A S D</span> / <span class="key">Arrow Keys</span> Move</div>
          <div class="control-item"><span class="key">Space</span> / <span class="key">Click</span> Shoot</div>
          <div class="control-item"><span class="key">P</span> Pause</div>
        </div>
        <button class="btn btn-primary" id="start-btn">Start Game</button>
      </div>
    </div>
  </div>
  <div id="fps-counter">FPS: 0</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
